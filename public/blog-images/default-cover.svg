<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Subtle circuit board pattern -->
  <g stroke="#1e293b" stroke-width="1" fill="none">
    <path d="M 0 115 L 215 115 L 265 165 L 425 165"/>
    <path d="M 0 255 L 125 255 L 175 205 L 365 205 L 415 255 L 615 255"/>
    <path d="M 1200 405 L 1005 405 L 955 355 L 765 355"/>
    <path d="M 1200 155 L 1115 155 L 1065 105 L 865 105"/>
    <circle cx="215" cy="115" r="3" fill="#1e293b"/>
    <circle cx="425" cy="165" r="3" fill="#1e293b"/>
    <circle cx="365" cy="205" r="3" fill="#1e293b"/>
    <circle cx="615" cy="255" r="3" fill="#1e293b"/>
    <circle cx="955" cy="355" r="3" fill="#1e293b"/>
    <circle cx="765" cy="355" r="3" fill="#1e293b"/>
    <circle cx="1065" cy="105" r="3" fill="#1e293b"/>
  </g>

  <!-- Floating glow nodes -->
  <g fill="#06b6d4" opacity="0.12">
    <circle cx="165" cy="195" r="46"/>
    <circle cx="1035" cy="435" r="62"/>
    <circle cx="935" cy="135" r="34"/>
    <circle cx="325" cy="485" r="48"/>
  </g>

  <!-- Central code document -->
  <g transform="translate(600, 315)">
    <!-- Outer orbit ring -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.25"/>
    <circle cx="0" cy="0" r="178" fill="none" stroke="#0e7490" stroke-width="1" stroke-dasharray="4,6" opacity="0.35"/>

    <!-- Document sheet -->
    <rect x="-150" y="-140" width="300" height="280" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <!-- Folded corner -->
    <path d="M 90 -140 L 150 -80 L 150 -140 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <path d="M 90 -140 L 150 -80" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>

    <!-- Code lines -->
    <g stroke="#06b6d4" stroke-width="2" opacity="0.45" stroke-linecap="round">
      <line x1="-115" y1="-95" x2="-45" y2="-95"/>
      <line x1="-115" y1="-75" x2="20" y2="-75"/>
      <line x1="-115" y1="-55" x2="85" y2="-55"/>
      <line x1="-115" y1="-35" x2="-10" y2="-35"/>
      <line x1="-115" y1="-15" x2="60" y2="-15"/>
      <line x1="-115" y1="5" x2="30" y2="5"/>
      <line x1="-115" y1="25" x2="-70" y2="25"/>
    </g>

    <!-- Cursor block -->
    <rect x="-115" y="40" width="130" height="16" rx="4" fill="#0e7490" opacity="0.5"/>
    <circle cx="-58" cy="48" r="4" fill="#06b6d4" opacity="0.8"/>
  </g>

  <!-- Orbiting code labels -->
  <g opacity="0.9">
    <g transform="translate(0, -152)">
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="9" font-weight="bold">CODE</text>
      <line x1="0" y1="26" x2="0" y2="52" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
    </g>
    <g transform="translate(120, 98)">
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#0e7490" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#0e7490" font-family="monospace" font-size="9" font-weight="bold">TYPE</text>
      <line x1="-18" y1="-18" x2="-44" y2="-44" stroke="#0e7490" stroke-width="1.5" opacity="0.4"/>
    </g>
    <g transform="translate(-120, 98)">
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="9" font-weight="bold">DEV</text>
      <line x1="18" y1="-18" x2="44" y2="-44" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
    </g>
  </g>

  <!-- Decorative dots around orbit -->
  <g fill="#06b6d4" opacity="0.4">
    <circle cx="0" cy="-200" r="3"/>
    <circle cx="173" cy="-100" r="3"/>
    <circle cx="173" cy="100" r="3"/>
    <circle cx="0" cy="200" r="3"/>
    <circle cx="-173" cy="100" r="3"/>
    <circle cx="-173" cy="-100" r="3"/>
  </g>

  <!-- Floating code brackets -->
  <g stroke="#06b6d4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M 205 465 L 190 480 L 190 500 L 205 515"/>
    <path d="M 241 465 L 256 480 L 256 500 L 241 515"/>
  </g>

  <!-- Corner accents -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.2" fill="none">
    <path d="M 20 20 L 20 60 L 60 60"/>
    <path d="M 1180 610 L 1180 570 L 1140 570"/>
    <path d="M 1180 20 L 1140 20 L 1140 60"/>
    <path d="M 20 610 L 20 570 L 60 570"/>
  </g>
</svg>
