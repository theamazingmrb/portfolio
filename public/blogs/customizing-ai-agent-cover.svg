<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Subtle grid pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Central control panel / configuration hub -->
  <g transform="translate(600, 315)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.2"/>

    <!-- Central brain / processing node -->
    <circle cx="0" cy="0" r="60" fill="#06b6d4" opacity="0.1"/>
    <circle cx="0" cy="0" r="45" fill="#0e7490" opacity="0.3"/>
    <circle cx="0" cy="0" r="25" fill="#06b6d4" opacity="0.6"/>

    <!-- Orbiting configuration nodes -->
    <g opacity="0.9">
      <!-- SOUL node (top) -->
      <g transform="translate(0, -130)">
        <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
        <text x="0" y="5" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="10" font-weight="bold">SOUL</text>
        <line x1="0" y1="30" x2="0" y2="75" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
      </g>

      <!-- Skills node (bottom right) -->
      <g transform="translate(113, 65)">
        <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#0e7490" stroke-width="2"/>
        <text x="0" y="5" text-anchor="middle" fill="#0e7490" font-family="monospace" font-size="9" font-weight="bold">SKILLS</text>
        <line x1="-20" y1="-20" x2="-50" y2="-50" stroke="#0e7490" stroke-width="1.5" opacity="0.5"/>
      </g>

      <!-- Memory node (bottom left) -->
      <g transform="translate(-113, 65)">
        <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
        <text x="0" y="5" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="8" font-weight="bold">MEMORY</text>
        <line x1="20" y1="-20" x2="50" y2="-50" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
      </g>
    </g>

    <!-- Connection pulses -->
    <g stroke="#06b6d4" stroke-width="1" opacity="0.3" stroke-dasharray="3,3">
      <line x1="0" y1="-60" x2="0" y2="-100"/>
      <line x1="42" y1="42" x2="80" y2="80"/>
      <line x1="-42" y1="42" x2="-80" y2="80"/>
    </g>

    <!-- Small decorative dots around orbit -->
    <g fill="#06b6d4" opacity="0.4">
      <circle cx="0" cy="-180" r="3"/>
      <circle cx="156" cy="-90" r="3"/>
      <circle cx="156" cy="90" r="3"/>
      <circle cx="0" cy="180" r="3"/>
      <circle cx="-156" cy="90" r="3"/>
      <circle cx="-156" cy="-90" r="3"/>
    </g>
  </g>

  <!-- Floating config elements around the edges -->
  <g opacity="0.3" stroke="#06b6d4" stroke-width="1.5" fill="none">
    <!-- Gear top left -->
    <g transform="translate(180, 150)">
      <circle cx="0" cy="0" r="20" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#06b6d4" opacity="0.3"/>
      <line x1="0" y1="-28" x2="0" y2="-20" stroke-width="3"/>
      <line x1="0" y1="28" x2="0" y2="20" stroke-width="3"/>
      <line x1="-28" y1="0" x2="-20" y2="0" stroke-width="3"/>
      <line x1="28" y1="0" x2="20" y2="0" stroke-width="3"/>
      <line x1="-20" y1="-20" x2="-14" y2="-14" stroke-width="3"/>
      <line x1="20" y1="-20" x2="14" y2="-14" stroke-width="3"/>
      <line x1="-20" y1="20" x2="-14" y2="14" stroke-width="3"/>
      <line x1="20" y1="20" x2="14" y2="14" stroke-width="3"/>
    </g>

    <!-- Slider bottom right -->
    <g transform="translate(980, 480)">
      <rect x="-40" y="-4" width="80" height="8" rx="4" stroke="#0e7490" fill="none" stroke-width="2"/>
      <rect x="-15" y="-10" width="16" height="20" rx="3" fill="#0e7490" opacity="0.4"/>
    </g>

    <!-- Toggle switch top right -->
    <g transform="translate(1020, 180)">
      <rect x="-25" y="-10" width="50" height="20" rx="10" stroke="#22d3ee" fill="none" stroke-width="2"/>
      <circle cx="10" cy="0" r="6" fill="#22d3ee" opacity="0.6"/>
    </g>

    <!-- Code brackets bottom left -->
    <g transform="translate(200, 500)" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round">
      <path d="M 0 0 L -12 12 L -12 28 L 0 40"/>
      <path d="M 30 0 L 42 12 L 42 28 L 30 40"/>
    </g>
  </g>

  <!-- Corner accents -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.15" fill="none">
    <path d="M 20 20 L 20 60 L 60 60"/>
    <path d="M 1180 610 L 1180 570 L 1140 570"/>
    <path d="M 1180 20 L 1140 20 L 1140 60"/>
    <path d="M 20 610 L 20 570 L 60 570"/>
  </g>
</svg>
