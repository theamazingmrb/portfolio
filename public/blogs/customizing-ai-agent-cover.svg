<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" aria-label="An AI agent being configured through SOUL, skills, and memory modules">
  <rect width="1200" height="630" fill="#f4f1ea"/>

  <!-- Editorial grid -->
  <g stroke="#d9d5cb" stroke-width="1" opacity="0.5">
    <line x1="0" y1="157.5" x2="1200" y2="157.5"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Subtle construction frame -->
  <g stroke="#6b9b88" stroke-width="1.5" fill="none" opacity="0.35">
    <path d="M 80 80 L 80 150 L 150 150"/>
    <path d="M 1120 80 L 1120 150 L 1050 150"/>
    <path d="M 80 550 L 80 480 L 150 480"/>
    <path d="M 1120 550 L 1120 480 L 1050 480"/>
  </g>

  <!-- Central agent / brain made of connected nodes -->
  <g transform="translate(600, 315)">
    <!-- Orbit rings -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="#d9d5cb" stroke-width="1" opacity="0.6" stroke-dasharray="8 8"/>
    <circle cx="0" cy="0" r="145" fill="none" stroke="#c44226" stroke-width="1.5" opacity="0.35"/>

    <!-- Brain / head silhouette -->
    <path d="M -40 -95 C 20 -105, 75 -70, 80 -20 C 85 25, 65 75, 25 95 C -15 100, -65 75, -80 20 C -90 -30, -75 -85, -40 -95 Z" fill="#fff" stroke="#24231f" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Brain fold lines -->
    <g stroke="#c44226" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M -35 -50 C -15 -60, 25 -30, 20 0"/>
      <path d="M -25 10 C -5 25, 35 15, 45 -20"/>
      <path d="M -45 0 C -25 20, -15 50, 25 45"/>
      <path d="M -5 -30 C 15 -20, 30 15, 15 35"/>
      <path d="M -50 -20 C -30 -35, 0 -45, 25 -30"/>
    </g>

    <!-- Neural nodes -->
    <g fill="#c44226">
      <circle cx="-25" cy="-45" r="4"/>
      <circle cx="30" cy="-25" r="4"/>
      <circle cx="5" cy="25" r="4"/>
      <circle cx="-35" cy="15" r="4"/>
      <circle cx="40" cy="30" r="4"/>
      <circle cx="-10" cy="-15" r="4"/>
      <circle cx="25" cy="5" r="4"/>
    </g>

    <!-- Subtle face profile hint -->
    <path d="M 30 -75 Q 55 -60 60 -35 Q 62 -20 55 -10" fill="none" stroke="#24231f" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- SOUL.md module -->
  <g transform="translate(305, 205) rotate(-6)">
    <rect x="-75" y="-45" width="150" height="90" rx="6" fill="#fff" stroke="#24231f" stroke-width="2"/>
    <rect x="-70" y="-40" width="140" height="80" rx="3" fill="none" stroke="#d9d5cb" stroke-width="1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#24231f">
      <text x="-60" y="-20" font-weight="bold" fill="#c44226">SOUL.md</text>
      <text x="-60" y="0">Identity</text>
      <text x="-60" y="18">Voice</text>
      <text x="-60" y="36">Rules</text>
    </g>
  </g>

  <!-- Skills module -->
  <g transform="translate(895, 205) rotate(6)">
    <rect x="-75" y="-45" width="150" height="90" rx="6" fill="#fff" stroke="#24231f" stroke-width="2"/>
    <rect x="-70" y="-40" width="140" height="80" rx="3" fill="none" stroke="#d9d5cb" stroke-width="1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#24231f">
      <text x="-60" y="-20" font-weight="bold" fill="#6b9b88">SKILLS</text>
      <text x="-60" y="0">run_shell</text>
      <text x="-60" y="18">read_file</text>
      <text x="-60" y="36">edit_file</text>
    </g>
  </g>

  <!-- Memory module -->
  <g transform="translate(600, 500)">
    <rect x="-75" y="-45" width="150" height="90" rx="6" fill="#fff" stroke="#24231f" stroke-width="2"/>
    <rect x="-70" y="-40" width="140" height="80" rx="3" fill="none" stroke="#d9d5cb" stroke-width="1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#24231f">
      <text x="-60" y="-20" font-weight="bold" fill="#c44226">MEMORY</text>
      <rect x="-60" y="-10" width="120" height="10" rx="2" fill="#d9d5cb" opacity="0.4"/>
      <rect x="-60" y="5" width="95" height="10" rx="2" fill="#d9d5cb" opacity="0.4"/>
      <rect x="-60" y="20" width="110" height="10" rx="2" fill="#d9d5cb" opacity="0.4"/>
    </g>
  </g>

  <!-- Connection lines from modules to brain -->
  <g stroke="#24231f" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4">
    <line x1="360" y1="220" x2="480" y2="260"/>
    <line x1="840" y1="220" x2="720" y2="260"/>
    <line x1="600" y1="455" x2="600" y2="400"/>
  </g>

  <!-- Data flow dots -->
  <g fill="#c44226">
    <circle cx="430" cy="245" r="5"/>
    <circle cx="770" cy="245" r="5"/>
    <circle cx="600" cy="430" r="5"/>
  </g>

  <!-- Control dials -->
  <g transform="translate(180, 315)" stroke="#24231f" stroke-width="1.5" fill="none">
    <circle cx="0" cy="0" r="28" fill="#fff"/>
    <line x1="0" y1="0" x2="18" y2="-14" stroke="#c44226" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#24231f" stroke="none"/>
    <!-- Ticks -->
    <line x1="0" y1="-28" x2="0" y2="-22" stroke="#d9d5cb" stroke-width="1.5"/>
    <line x1="20" y1="14" x2="16" y2="11" stroke="#d9d5cb" stroke-width="1.5"/>
    <line x1="-20" y1="14" x2="-16" y2="11" stroke="#d9d5cb" stroke-width="1.5"/>
  </g>

  <g transform="translate(1020, 315)" stroke="#24231f" stroke-width="1.5" fill="none">
    <rect x="-34" y="-20" width="68" height="40" rx="20" fill="#fff"/>
    <circle cx="12" cy="0" r="14" fill="#6b9b88" stroke="none"/>
  </g>

  <!-- Editorial coordinates -->
  <text x="70" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6b9b88" letter-spacing="0.08em">FIG. 03 — AGENT CONFIGURATION</text>
  <text x="940" y="595" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#24231f" opacity="0.5" letter-spacing="0.08em">SOUL · SKILLS · MEMORY</text>
</svg>
