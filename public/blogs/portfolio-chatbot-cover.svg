<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Subtle circuit board pattern -->
  <g stroke="#1e293b" stroke-width="1" fill="none">
    <path d="M 0 120 L 220 120 L 270 170 L 420 170"/>
    <path d="M 0 260 L 120 260 L 170 210 L 360 210 L 410 260 L 620 260"/>
    <path d="M 1200 400 L 1000 400 L 950 350 L 760 350"/>
    <path d="M 1200 160 L 1110 160 L 1060 110 L 860 110"/>
    <circle cx="220" cy="120" r="3" fill="#1e293b"/>
    <circle cx="420" cy="170" r="3" fill="#1e293b"/>
    <circle cx="360" cy="210" r="3" fill="#1e293b"/>
    <circle cx="620" cy="260" r="3" fill="#1e293b"/>
    <circle cx="950" cy="350" r="3" fill="#1e293b"/>
    <circle cx="760" cy="350" r="3" fill="#1e293b"/>
    <circle cx="1060" cy="110" r="3" fill="#1e293b"/>
  </g>

  <!-- Floating chat / retrieval nodes -->
  <g fill="#06b6d4" opacity="0.12">
    <circle cx="170" cy="200" r="46"/>
    <circle cx="1030" cy="430" r="62"/>
    <circle cx="940" cy="130" r="34"/>
    <circle cx="320" cy="480" r="48"/>
  </g>

  <!-- Central chat bubble + RAG pipeline -->
  <g transform="translate(600, 315)">
    <!-- Outer orbit ring -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.25"/>
    <circle cx="0" cy="0" r="178" fill="none" stroke="#0e7490" stroke-width="1" stroke-dasharray="4,6" opacity="0.35"/>

    <!-- Large chat bubble -->
    <path d="M -150 -40 L 150 -40 A 36 36 0 0 1 186 -4 L 186 96 A 36 36 0 0 1 150 132 L 20 132 L -8 166 L -4 132 L -150 132 A 36 36 0 0 1 -186 96 L -186 -4 A 36 36 0 0 1 -150 -40 Z"
          fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <!-- Chat tail -->
    <path d="M -8 166 L 4 132" stroke="#06b6d4" stroke-width="2" fill="none"/>

    <!-- Message lines inside bubble -->
    <g stroke="#06b6d4" stroke-width="2" opacity="0.45" stroke-linecap="round">
      <line x1="-150" y1="-10" x2="-30" y2="-10"/>
      <line x1="-150" y1="22" x2="90" y2="22"/>
      <line x1="-150" y1="54" x2="60" y2="54"/>
      <line x1="-150" y1="86" x2="-10" y2="86"/>
    </g>
    <!-- User input line -->
    <rect x="-150" y="108" width="180" height="14" rx="7" fill="#0e7490" opacity="0.4"/>
  </g>

  <!-- Orbiting chunks / retrieval nodes -->
  <g opacity="0.9">
    <!-- CHUNK node (top) -->
    <g transform="translate(0, -150)">
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="10" font-weight="bold">CHUNK</text>
      <line x1="0" y1="26" x2="0" y2="52" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
    </g>
    <!-- EMBED node (bottom right) -->
    <g transform="translate(120, 98)">
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#0e7490" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#0e7490" font-family="monospace" font-size="9" font-weight="bold">EMBED</text>
      <line x1="-18" y1="-18" x2="-44" y2="-44" stroke="#0e7490" stroke-width="1.5" opacity="0.4"/>
    </g>
    <!-- RETRIEVE node (bottom left) -->
    <g transform="translate(-120, 98)">
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="8" font-weight="bold">RETRIEVE</text>
      <line x1="18" y1="-18" x2="44" y2="-44" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
    </g>
  </g>

  <!-- Decorative dots around orbit -->
  <g fill="#06b6d4" opacity="0.4">
    <circle cx="0" cy="-200" r="3"/>
    <circle cx="173" cy="-100" r="3"/>
    <circle cx="173" cy="100" r="3"/>
    <circle cx="0" cy="200" r="3"/>
    <circle cx="-173" cy="100" r="3"/>
    <circle cx="-173" cy="-100" r="3"/>
  </g>

  <!-- Floating code brackets -->
  <g stroke="#06b6d4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M 200 460 L 185 475 L 185 495 L 200 510"/>
    <path d="M 236 460 L 251 475 L 251 495 L 236 510"/>
  </g>

  <!-- Corner accents -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.2" fill="none">
    <path d="M 20 20 L 20 60 L 60 60"/>
    <path d="M 1180 610 L 1180 570 L 1140 570"/>
    <path d="M 1180 20 L 1140 20 L 1140 60"/>
    <path d="M 20 610 L 20 570 L 60 570"/>
  </g>
</svg>
