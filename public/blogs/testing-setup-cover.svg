<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Subtle circuit board pattern -->
  <g stroke="#1e293b" stroke-width="1" fill="none">
    <path d="M 0 110 L 210 110 L 260 160 L 430 160"/>
    <path d="M 0 250 L 130 250 L 180 200 L 370 200 L 420 250 L 610 250"/>
    <path d="M 1200 410 L 990 410 L 940 360 L 770 360"/>
    <path d="M 1200 150 L 1120 150 L 1070 100 L 870 100"/>
    <circle cx="210" cy="110" r="3" fill="#1e293b"/>
    <circle cx="430" cy="160" r="3" fill="#1e293b"/>
    <circle cx="370" cy="200" r="3" fill="#1e293b"/>
    <circle cx="610" cy="250" r="3" fill="#1e293b"/>
    <circle cx="940" cy="360" r="3" fill="#1e293b"/>
    <circle cx="770" cy="360" r="3" fill="#1e293b"/>
    <circle cx="1070" cy="100" r="3" fill="#1e293b"/>
  </g>

  <!-- Floating test nodes -->
  <g fill="#06b6d4" opacity="0.12">
    <circle cx="160" cy="190" r="46"/>
    <circle cx="1040" cy="440" r="62"/>
    <circle cx="930" cy="130" r="34"/>
    <circle cx="330" cy="490" r="48"/>
  </g>

  <!-- Central test-runner panel -->
  <g transform="translate(600, 315)">
    <!-- Outer orbit ring -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.25"/>
    <circle cx="0" cy="0" r="178" fill="none" stroke="#0e7490" stroke-width="1" stroke-dasharray="4,6" opacity="0.35"/>

    <!-- Terminal window -->
    <rect x="-175" y="-120" width="350" height="240" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <!-- Title bar -->
    <rect x="-175" y="-120" width="350" height="34" rx="10" fill="#1e293b"/>
    <rect x="-175" y="-86" width="350" height="1" fill="#334155"/>
    <!-- Window dots -->
    <circle cx="-150" cy="-103" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="-133" cy="-103" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="-116" cy="-103" r="5" fill="#22c55e" opacity="0.8"/>
    <!-- Title text -->
    <text x="20" y="-98" fill="#64748b" font-family="monospace" font-size="12">npm run test</text>

    <!-- Test output lines -->
    <g font-family="monospace" font-size="14">
      <!-- passing tests -->
      <circle cx="-140" cy="-40" r="6" fill="#22c55e"/>
      <text x="-125" y="-35" fill="#4ade80">✓ ContactForm validation passes</text>
      <circle cx="-140" cy="-6" r="6" fill="#22c55e"/>
      <text x="-125" y="-1" fill="#4ade80">✓ ContactForm submit success</text>
      <circle cx="-140" cy="28" r="6" fill="#22c55e"/>
      <text x="-125" y="33" fill="#4ade80">✓ Dark mode toggle renders</text>
      <circle cx="-140" cy="62" r="6" fill="#22c55e"/>
      <text x="-125" y="67" fill="#4ade80">✓ Navbar mobile menu opens</text>
    </g>

    <!-- Summary bar -->
    <rect x="-150" y="88" width="300" height="18" rx="9" fill="#22c55e" opacity="0.15"/>
    <text x="-130" y="101" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">4 passed · 0 failed</text>
  </g>

  <!-- Orbiting test labels -->
  <g opacity="0.9">
    <g transform="translate(0, -152)">
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="9" font-weight="bold">PASS</text>
      <line x1="0" y1="26" x2="0" y2="52" stroke="#22c55e" stroke-width="1.5" opacity="0.4"/>
    </g>
    <g transform="translate(120, 98)">
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="8" font-weight="bold">VITEST</text>
      <line x1="-18" y1="-18" x2="-44" y2="-44" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
    </g>
    <g transform="translate(-120, 98)">
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#0e7490" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#0e7490" font-family="monospace" font-size="8" font-weight="bold">UNIT</text>
      <line x1="18" y1="-18" x2="44" y2="-44" stroke="#0e7490" stroke-width="1.5" opacity="0.4"/>
    </g>
  </g>

  <!-- Decorative dots around orbit -->
  <g fill="#06b6d4" opacity="0.4">
    <circle cx="0" cy="-200" r="3"/>
    <circle cx="173" cy="-100" r="3"/>
    <circle cx="173" cy="100" r="3"/>
    <circle cx="0" cy="200" r="3"/>
    <circle cx="-173" cy="100" r="3"/>
    <circle cx="-173" cy="-100" r="3"/>
  </g>

  <!-- Floating code brackets -->
  <g stroke="#06b6d4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M 210 460 L 195 475 L 195 495 L 210 510"/>
    <path d="M 246 460 L 261 475 L 261 495 L 246 510"/>
  </g>

  <!-- Corner accents -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.2" fill="none">
    <path d="M 20 20 L 20 60 L 60 60"/>
    <path d="M 1180 610 L 1180 570 L 1140 570"/>
    <path d="M 1180 20 L 1140 20 L 1140 60"/>
    <path d="M 20 610 L 20 570 L 60 570"/>
  </g>
</svg>
